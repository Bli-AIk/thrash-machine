name: Build Tagged Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string
      build_android_apk:
        description: Build the compiled Android APK (JDK 17 + Android SDK/NDK)
        required: false
        default: true
        type: boolean
      build_android_wrap:
        description: Build the quick wrapper Android APK (official LÖVE shell + game.love)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: tagged-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive
      - name: Verify required submodules
        run: |
          set -euo pipefail
          git submodule status --recursive
          test -s libraries/kristal-i18n/lib.lua
          test -s libraries/kristal-object-selector-plus/lib.lua
          test -s libraries/terminal-cli/lib.lua
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq love luajit rsync unzip xvfb zip
      - name: Verify source and version
        run: |
          make test
          version="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('mod.json').read_text(encoding='utf-8')
          match = re.search(r'(?m)^\s*"version"\s*:\s*"([^"]+)"', text)
          if not match:
              raise SystemExit('Could not find mod.json version')
          print(match.group(1))
          PY
          )"
          test "$version" = "$RELEASE_TAG"
      - name: Set up JDK 17
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_android_apk || inputs.build_android_wrap }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_android_apk }}
        uses: android-actions/setup-android@v3

      - name: Install Android API and NDK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_android_apk }}
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Build release assets
        run: |
          just build
          ./.github/scripts/build_mod.sh

      - name: Build Android APK (compile)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_android_apk }}
        run: ./tools/build_android.sh

      - name: Build Android wrapper APK (wrap)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_android_wrap }}
        run: ./tools/build_android_wrap.sh

      - name: Generate and verify SHA-256 manifest
        run: |
          .github/scripts/generate_sha256sums.sh dist
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: thrash-machine-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Thrash Machine $RELEASE_TAG" --generate-notes
          fi
          files=(dist/*.love dist/*-win64.zip dist/*-mod.zip dist/*.apk dist/SHA256SUMS)
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
